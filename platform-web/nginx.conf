# platform-web（Vue SPA）的 nginx 配置。
#
# 三件事，缺一个页面就"能打开但用不了"：
#   1. SPA 路由：未命中的路径回 index.html（vue-router 用 history 模式）
#   2. /api/** → platform-api（**去掉 /api 前缀**，与 vite.config.ts 里那份 dev proxy 同一条规则）
#   3. /auth/** → platform-auth（它配了 server.servlet.context-path=/auth，所有端点都在这一个前缀下）
#
# 本文件是 **http 版**。两种情况下它是对的：前门是 http，或 TLS 由更外层（k8s Ingress / LB）终结。
# **若要让本 nginx 自己终止 TLS**，用同目录的 nginx-https.conf（443 + 80 跳转，其余规则与本文一致）。
#
# ⚠️ 第 3 条不是可选项：SPA 的 origin、OAuth 的 issuer、redirect_uri **必须同 host 字符串**
#    （同源铁律）—— 不同源时会话 Cookie 不随 fetch 发，续期与登出全变 302。所以生产上
#    「用一个 origin 同时提供前端与认证端点」是唯一稳的部署形状，本文件就是那个形状。
#    配套的两处必须一起改：
#      · 构建参数：VITE_OAUTH_ISSUER=/auth（只写上下文路径，代码拼出 /auth/oauth2/... 的相对路径，
#        跟着本 nginx 的 origin 走）；回调地址默认取「页面 origin + /callback」，要改就设容器环境变量
#        PLATFORM_OAUTH_REDIRECT_URI（本文件末尾的 /runtime-config.js 现生成，重启容器即生效）
#      · platform-auth 库里 platform-web-client 注册的 redirect_uri 必须与前端实际用的**一字不差**
#        （精确匹配）。同一镜像换域名/端口时：改 PLATFORM_OAUTH_REDIRECT_URI 或在库里补登记，不用重新构建。
#
# ⚠️ 本文件是**模板**：镜像把它放在 /etc/nginx/templates/default.conf.template，nginx 官方镜像启动时
#    用 envsubst 渲染到 /etc/nginx/conf.d/default.conf。两个后端地址取环境变量（默认值见 Dockerfile）：
#      PLATFORM_API_URL   platform-api 的地址，默认 http://platform-api:8081
#      PLATFORM_AUTH_URL  platform-auth 的地址，默认 http://platform-auth:9527
#      PLATFORM_OAUTH_REDIRECT_URI  SPA 的 OAuth 回调地址，默认空 = 取「页面 origin + /callback」
#    写法 scheme://host:port，**结尾不要带 /**。只替换 PLATFORM_ 开头的变量（NGINX_ENVSUBST_FILTER），
#    $host、$scheme 这类 nginx 变量原样保留。地址里的主机名在 nginx 启动时就要能解析，
#    解析不到容器直接起不来（host not found in upstream）。
#    要整份换掉本文件时，挂载到模板位置（挂到 conf.d 会在启动时被模板渲染结果覆盖）：
#      docker run -v $PWD/my-nginx.conf:/etc/nginx/templates/default.conf.template:ro ...

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TLS 由更外层（k8s Ingress / LB）终结时，连接**到本 nginx 这一段**是 http，$scheme 恒为 http；
# 浏览器真实用的是 https，这个事实只有入口那一层知道，它写在请求头 X-Forwarded-Proto 里传进来。
# 取入口的值，取不到（直连本 nginx、没人发这个头）才退回实际连接协议。
# ⚠️ 该头可被客户端伪造 —— 只有前面**确实**有一层可信入口时才这么用；本端口别直接暴露给用户。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 转给 auth 的 Host：**保留端口**。
#   · $host 是 nginx 归一化后的主机名，**不含端口** —— 用它上游就丢了 :18080 这类端口
#   · $http_host 是客户端原样的 Host 头（含端口），前面的入口（Istio / LB）默认原样保留
#   · 没有 Host 头（HTTP/1.0）才退回 $host
# 这是 auth 算 issuer / 登录页地址的第一手依据；配合 X-Forwarded-Host（见 /auth/ 段）才完整 ——
# 2026-11-04 实测，只改 Host 不给带端口的 X-Forwarded-Host 时，Istio 入口下依旧跳到 http://<host>/auth/login.html。
map $http_host $auth_host {
    default $http_host;
    ''      $host;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源带内容哈希，可以放心长缓存。
    # 认证服务的静态资源（登录页、consent、客户端管理页）走 /auth/assets/**，不会与这里撞。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 平台接口：/api/** → platform-api（去前缀）----------
    location /api/ {
        proxy_pass ${PLATFORM_API_URL}/;
        proxy_http_version 1.1;

        # Pod exec / 日志 follow 走 WebSocket（后端开了 ws 升级）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：日志 follow 与 exec 可能几十分钟不说话，别被读超时掐断
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # 流式日志不缓冲，否则"实时"两个字名不副实
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 认证服务器：必须与 SPA 同源（见文件头）----------
    # platform-auth 有 server.servlet.context-path=/auth，**所有**端点都在这个前缀下
    # （/auth/oauth2/**、/auth/session/**、/auth/login.html、/auth/user/**、/auth/.well-known/**、
    #  登录页的静态资源 /auth/assets/**），所以一条前缀规则就够，新增端点也不会漏配。
    # ⚠️ proxy_pass 后面**不能带 URI**（PLATFORM_AUTH_URL 不要以 / 结尾），否则 /auth 前缀会被剥掉，
    #    auth 那边反而找不到端点。
    # ⚠️ issuer / 登录页地址都是 platform-auth **按它收到的请求现算**的（forward-headers-strategy=framework）：
    #    · Host —— 用 $auth_host（= $http_host，客户端原样的 Host，**含端口**）。别用 $host（它不含端口），
    #      也别留空让 nginx 发上游名。
    #    · 端口 —— 关键在 X-Forwarded-Host 要带端口：2026-11-04 在 auth 侧逐个头组合实测，
    #      只要请求里有 X-Forwarded-Proto 而没有带端口的 X-Forwarded-Host/Port，Spring 的
    #      ForwardedHeaderFilter 就按 scheme 的默认端口重建 URL，**Host 里的 :18080 直接不算数**
    #      （表现为点登录跳到 http://<host>/auth/login.html）。所以这里补 X-Forwarded-Host = $http_host，
    #      并把入口带来的 X-Forwarded-Port 清掉（Istio/Envoy 报的多半是它连上游那一段的 80，会盖掉真端口）。
    #    · X-Forwarded-Proto —— 用文件头那个 `$forwarded_proto`（入口透传的值，取不到才退回 $scheme）。
    #      直接写 $scheme 的话，TLS 由 Ingress 终结时它恒为 http，issuer 会被算成 http://，
    #      登录跳转和 Cookie 的 Secure 属性一起退化。登录 POST（/auth/user/login）正是写会话 Cookie
    #      的那一步，所以这条规则虽也覆盖静态资源，头必须带全。
    # auth 的客户端管理内部接口只给 platform-api 内网直连调；前门一律 404（纵深防御，auth 侧另有共享密钥）
    location /auth/internal/ {
        return 404;
    }

    location /auth/ {
        proxy_pass ${PLATFORM_AUTH_URL};
        # $auth_host（= $http_host，含端口），**不要**换成 $host，否则 issuer/登录页丢端口
        proxy_set_header Host              $auth_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # 端口靠 X-Forwarded-Host 带过去（见文件头）：Spring 只要看到 X-Forwarded-Proto 就按
        # scheme 的默认端口重建 URL，**Host 里的端口不算数**，必须再给一个带端口的 X-Forwarded-Host。
        proxy_set_header X-Forwarded-Host  $http_host;
        # 入口（Istio/Envoy）自带的 X-Forwarded-Port 多半是它连上游那一段的 80，会盖掉真实端口 —— 清掉
        proxy_set_header X-Forwarded-Port  "";
    }

    # ⚠️ /callback 有意**不转给**认证服务器：那是 SPA 自己的路由（oauth.ts 的 redirect_uri），
    #    认证服务器上那个同名端点是个遗留 demo，与登录无关。

    # ---------- 运行时配置 ----------
    # SPA 的回调地址等部署期参数：由容器环境变量 PLATFORM_OAUTH_REDIRECT_URI 现生成，
    # 改变量 + 重启容器即生效，**不用重新构建**（VITE_* 是构建期内联的，做不到这一点）。
    # 空值 = 未配置，前端回落到「页面 origin + /callback」。
    # ⚠️ 只替换 PLATFORM_ 开头的变量（NGINX_ENVSUBST_FILTER），$host 这类 nginx 变量不受影响。
    # ⚠️ 值里不要带双引号 —— 它被内联进 JS 字面量。
    # 精确匹配优先于静态文件：dist 里那份 public/runtime-config.js 占位在生产上不会被用到。
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.__PLATFORM_RUNTIME_CONFIG__ = {"oauthRedirectUri":"${PLATFORM_OAUTH_REDIRECT_URI}"};';
    }

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
