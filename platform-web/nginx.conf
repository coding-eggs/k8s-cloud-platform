# platform-web（Vue SPA）的 nginx 配置。
#
# 三件事，缺一个页面就"能打开但用不了"：
#   1. SPA 路由：未命中的路径回 index.html（vue-router 用 history 模式）
#   2. /api/** → platform-api（**去掉 /api 前缀**，与 vite.config.ts 里那份 dev proxy 同一条规则）
#   3. /auth/** → platform-auth（它配了 server.servlet.context-path=/auth，所有端点都在这一个前缀下）
#
# 本文件是 **http 版**。两种情况下它是对的：前门是 http，或 TLS 由更外层（k8s Ingress / LB）终结。
# **若要让本 nginx 自己终止 TLS**，用同目录的 nginx-https.conf（443 + 80 跳转，其余规则与本文一致）。
#
# ⚠️ 第 3 条不是可选项：SPA 的 origin、OAuth 的 issuer、redirect_uri **必须同 host 字符串**
#    （同源铁律）—— 不同源时会话 Cookie 不随 fetch 发，续期与登出全变 302。所以生产上
#    「用一个 origin 同时提供前端与认证端点」是唯一稳的部署形状，本文件就是那个形状。
#    配套的两处必须一起改：
#      · 构建参数：VITE_OAUTH_ISSUER=/auth（只写上下文路径，代码拼出 /auth/oauth2/... 的相对路径，
#        跟着本 nginx 的 origin 走），VITE_OAUTH_REDIRECT_URI = 本 nginx 的 origin + /callback
#      · platform-auth 库里 platform-web-client 注册的 redirect_uri（要一字不差）
#
# ⚠️ 服务名（platform-api / platform-auth）是 docker-compose / k8s Service 的 DNS 名。
#    你的部署里叫别的名字，就改下面两处 upstream；也可以挂载自己的 conf 覆盖本文件：
#      docker run -v $PWD/my-nginx.conf:/etc/nginx/conf.d/default.conf ...

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TLS 由更外层（k8s Ingress / LB）终结时，连接**到本 nginx 这一段**是 http，$scheme 恒为 http；
# 浏览器真实用的是 https，这个事实只有入口那一层知道，它写在请求头 X-Forwarded-Proto 里传进来。
# 取入口的值，取不到（直连本 nginx、没人发这个头）才退回实际连接协议。
# ⚠️ 该头可被客户端伪造 —— 只有前面**确实**有一层可信入口时才这么用；本端口别直接暴露给用户。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源带内容哈希，可以放心长缓存。
    # 认证服务的静态资源（登录页、consent、客户端管理页）走 /auth/assets/**，不会与这里撞。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 平台接口：/api/** → platform-api（去前缀）----------
    location /api/ {
        proxy_pass http://platform-api:8081/;
        proxy_http_version 1.1;

        # Pod exec / 日志 follow 走 WebSocket（后端开了 ws 升级）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：日志 follow 与 exec 可能几十分钟不说话，别被读超时掐断
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # 流式日志不缓冲，否则"实时"两个字名不副实
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 认证服务器：必须与 SPA 同源（见文件头）----------
    # platform-auth 有 server.servlet.context-path=/auth，**所有**端点都在这个前缀下
    # （/auth/oauth2/**、/auth/session/**、/auth/login.html、/auth/user/**、/auth/.well-known/**、
    #  登录页的静态资源 /auth/assets/**），所以一条前缀规则就够，新增端点也不会漏配。
    # ⚠️ proxy_pass 后面**不能带 URI**（不要写成 http://platform-auth:9527/），否则 /auth 前缀会被剥掉，
    #    auth 那边反而找不到端点。
    # ⚠️ issuer / 登录页地址都是 platform-auth **按它收到的请求现算**的（forward-headers-strategy=framework）：
    #    · Host $host —— 别让 auth 看到上游名（不写 proxy_set_header Host 时默认是 platform-auth:9527）。
    #    · 端口 —— **nginx 的 $host 不含端口**，所以上面的 Host 一赋值就把端口丢了。前门若不是
    #      80/443（NodePort、自定义端口），必须补 `proxy_set_header X-Forwarded-Port $server_port;`，
    #      否则 issuer 退回默认端口、登录页被甩到 80（2026-10-27 实测：Host 不带端口时拼出
    #      http://192.168.85.1/auth/login.html；Host 自带 :5173 时则是 http://192.168.85.1:5173/…）。
    #    · X-Forwarded-Proto —— 用文件头那个 `$forwarded_proto`（入口透传的值，取不到才退回 $scheme）。
    #      直接写 $scheme 的话，TLS 由 Ingress 终结时它恒为 http，issuer 会被算成 http://，
    #      登录跳转和 Cookie 的 Secure 属性一起退化。登录 POST（/auth/user/login）正是写会话 Cookie
    #      的那一步，所以这条规则虽也覆盖静态资源，头必须带全。
    location /auth/ {
        proxy_pass http://platform-auth:9527;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ⚠️ /callback 有意**不转给**认证服务器：那是 SPA 自己的路由（oauth.ts 的 redirect_uri），
    #    认证服务器上那个同名端点是个遗留 demo，与登录无关。

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
