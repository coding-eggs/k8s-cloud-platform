# platform-web（Vue SPA）的 nginx 配置。
#
# 三件事，缺一个页面就"能打开但用不了"：
#   1. SPA 路由：未命中的路径回 index.html（vue-router 用 history 模式）
#   2. /api/** → platform-api（**去掉 /api 前缀**，与 vite.config.ts 里那份 dev proxy 同一条规则）
#   3. /oauth2、/session 等 → platform-auth
#
# ⚠️ 第 3 条不是可选项：SPA 的 origin、OAuth 的 issuer、redirect_uri **必须同 host 字符串**
#    （同源铁律）—— 不同源时会话 Cookie 不随 fetch 发，续期与登出全变 302。所以生产上
#    「用一个 origin 同时提供前端与认证端点」是唯一稳的部署形状，本文件就是那个形状。
#    配套的两处必须一起改：
#      · 构建时的 --build-arg VITE_OAUTH_ISSUER / VITE_OAUTH_REDIRECT_URI（本 nginx 的 origin）
#      · platform-auth 库里 platform-web-client 注册的 redirect_uri（要一字不差）
#
# ⚠️ 服务名（platform-api / platform-auth）是 docker-compose / k8s Service 的 DNS 名。
#    你的部署里叫别的名字，就改下面两处 upstream；也可以挂载自己的 conf 覆盖本文件：
#      docker run -v $PWD/my-nginx.conf:/etc/nginx/conf.d/default.conf ...

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源带内容哈希，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 平台接口：/api/** → platform-api（去前缀）----------
    location /api/ {
        proxy_pass http://platform-api:8081/;
        proxy_http_version 1.1;

        # Pod exec / 日志 follow 走 WebSocket（后端开了 ws 升级）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：日志 follow 与 exec 可能几十分钟不说话，别被读超时掐断
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # 流式日志不缓冲，否则"实时"两个字名不副实
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 认证服务器：必须与 SPA 同源（见文件头）----------
    # /oauth2/authorize（302 跳转）、/oauth2/token（fetch）、/oauth2/jwks、/oauth2/consent
    location /oauth2/ {
        proxy_pass http://platform-auth:9527;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 会话续期与登出（自定义 grant 用会话 Cookie 换 token）
    location /session/ {
        proxy_pass http://platform-auth:9527;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 表单登录页（authorize 未登录时 302 到这里）与 OIDC 元数据
    location = /login      { proxy_pass http://platform-auth:9527; }
    location /login/       { proxy_pass http://platform-auth:9527; }
    location /.well-known/ { proxy_pass http://platform-auth:9527; }
    location = /userinfo   { proxy_pass http://platform-auth:9527; }

    # ⚠️ /callback 有意**不转给**认证服务器：那是 SPA 自己的路由（oauth.ts 的 redirect_uri），
    #    认证服务器上那个同名端点是个遗留 demo，与登录无关。

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
