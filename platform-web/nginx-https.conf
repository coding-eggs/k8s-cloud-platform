# platform-web（Vue SPA）的 nginx 配置 —— **HTTPS 版**：TLS 由本 nginx 终止。
#
# 与同目录 nginx.conf（http 版）相比只有三处不同，其余路由规则逐条对齐 —— 「同源铁律」不变：
#   1. 监听 443 并挂证书；80 只做 301 跳到 https
#   2. X-Forwarded-Proto 如实为 https（auth 据此算 issuer；传错就会把登录跳转算成 http://）
#   3. 会话 Cookie 会自动带上 Secure（Spring Session 的 DefaultCookieSerializer 按 request.isSecure()
#      决定），所以**必须**保证浏览器全程走 https —— 80 端口只跳转、绝不出页面
#
# ⚠️ 什么时候**不要**用本文件：
#    TLS 由 k8s Ingress / 前置 LB 终止时，用 nginx.conf —— 它已经用
#    `map $http_x_forwarded_proto $forwarded_proto` 自动取入口透传的协议，不用手工改；
#    那种情况下本文件会让 nginx 自己也要求证书，多一层没必要。
#
# ⚠️ 证书必须被客户端信任。自签且没装根证书时：顶层导航还能点「继续访问」，但 fetch/XHR 会被浏览器
#    直接拒绝（ERR_CERT_AUTHORITY_INVALID，JS 层没有开关），表现为「登录点了没反应」「续期静默失效」。
#    另：证书的 SAN 要写浏览器实际用的那一串 —— 走 IP 访问就得有 `subjectAltName=IP:192.168.85.1`，
#    只写 CN 会报名称不匹配。
#
# 用法（镜像默认用 nginx.conf，需挂载覆盖）：
#   docker run --rm -p 80:80 -p 443:443 \
#     -v "$PWD/nginx-https.conf:/etc/nginx/templates/default.conf.template:ro" \
#     -v "$PWD/certs:/etc/nginx/certs:ro" \
#     k8s-cloud-platform/web:latest
#   证书放在 /etc/nginx/certs/tls.crt 与 tls.key（缺任何一个 nginx 都起不来）。
#
# 配套要改的两处（必须一字不差）：
#   · 构建参数 VITE_OAUTH_ISSUER=/auth（只写上下文路径，拼出 /auth/oauth2/... 相对路径）；
#     回调地址默认取「页面 origin + /callback」，要改就设容器环境变量 PLATFORM_OAUTH_REDIRECT_URI
#     （本文件末尾的 /runtime-config.js 现生成，重启容器即生效，不用重新构建）
#   · platform-auth 库里 platform-web-client 注册的 redirect_uri 必须与前端实际用的**一字不差**
#     （精确匹配，不是前缀/通配）。
#
# ⚠️ 本文件是**模板**（与 nginx.conf 同一套）：nginx 官方镜像启动时用 envsubst 渲染，
#    两个后端地址取环境变量 PLATFORM_API_URL / PLATFORM_AUTH_URL（默认值见 Dockerfile），
#    回调地址取 PLATFORM_OAUTH_REDIRECT_URI（可空 = 取页面 origin + /callback），
#    写法 scheme://host:port，结尾不要带 /。$host 等 nginx 变量不受影响（只替换 PLATFORM_ 开头的）。
#    所以挂载位置是**模板目录**（见上面用法）：挂到 conf.d/default.conf 会在启动时被默认模板的渲染结果覆盖。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 真实协议以「入口那一层」为准：本文件通常由自己终止 TLS（$scheme 就是 https），
# 但如果本 nginx 前面还挂了一层 LB 终结 TLS，连接到这里又会变成 http —— 那时只有
# X-Forwarded-Proto 是真相。取入口的值，取不到（直连本 nginx）才退回实际连接协议。
# ⚠️ 该头可被客户端伪造：只有前面**确实**有一层可信入口时才这么用。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 端口同理：$host 不含端口，auth 算 issuer 时要用「浏览器看到的那个端口」。
# 入口（LB）透传 X-Forwarded-Port 就用它，否则退回本 nginx 实际监听的端口
# （监听 443 时等价于不传；改成 8443 这类端口时没有它会丢端口 → 登录页被甩回 443）。
map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ''      $server_port;
}

# 转给 auth 的 Host：**保留端口**。
#   · $host 是 nginx 归一化后的主机名，**不含端口**
#   · $http_host 是客户端原样的 Host 头（含端口），前面的入口默认原样保留
#   · 没有 Host 头（HTTP/1.0）才退回 $host
# 本文件监听 443 时两者等价；前面还有 LB / 非 443 端口时必须用 $http_host。
map $http_host $auth_host {
    default $http_host;
    ''      $host;
}

# 传给 auth 的 X-Forwarded-Port：**Host 已带端口就不传**（入口报的可能是上游那一段的端口，
# 会盖掉 Host 里的真实端口）。Host 不带端口时才用它。
map $http_host $auth_port_header {
    "~:"     "";
    default  $forwarded_port;
}

# ---------- 80：只做跳转 ----------
# http 与 https 在浏览器眼里是**不同的 site**（scheme 也算），停在 http 上会让 SameSite=Lax 的
# SESSION Cookie 失效——表现为能登录、续期恒失败。所以这里不出页面，只 301。
server {
    listen       80;
    server_name  _;
    return 301 https://$host$request_uri;
}

# ---------- 443：真正的站点 ----------
server {
    listen       443 ssl;
    http2        on;          # nginx ≥ 1.25 的写法（旧写法 listen ... http2 已废弃）
    server_name  _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 自签 / 内网环境**先别开 HSTS**：一旦下发，浏览器会记住「永远只能 https」，
    # 之后换 IP、证书过期时连「继续访问」都不给点，回滚很痛。等证书链路稳定了再打开。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源带内容哈希，可以放心长缓存。
    # 认证服务的静态资源（登录页、consent、客户端管理页）走 /auth/assets/**，不会与这里撞。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 平台接口：/api/** → platform-api（去前缀）----------
    location /api/ {
        proxy_pass ${PLATFORM_API_URL}/;
        proxy_http_version 1.1;

        # Pod exec / 日志 follow 走 WebSocket（后端开了 ws 升级）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：日志 follow 与 exec 可能几十分钟不说话，别被读超时掐断
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # 流式日志不缓冲，否则"实时"两个字名不副实
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 认证服务器：必须与 SPA 同源（见文件头）----------
    # platform-auth 有 server.servlet.context-path=/auth，**所有**端点都在这个前缀下
    # （/auth/oauth2/**、/auth/session/**、/auth/login.html、/auth/user/**、/auth/.well-known/**、
    #  登录页的静态资源 /auth/assets/**），所以一条前缀规则就够，新增端点也不会漏配。
    # ⚠️ proxy_pass 后面**不能带 URI**（PLATFORM_AUTH_URL 不要以 / 结尾），否则 /auth 前缀会被剥掉。
    # ⚠️ issuer / 登录页地址都是 platform-auth **按它收到的请求现算**的（forward-headers-strategy=framework）：
    #    · Host $host —— 别让 auth 看到上游名（不写 proxy_set_header Host 时默认是上游的 host:port）。
    #    · X-Forwarded-Proto —— 用文件头那个 `$forwarded_proto`：本文件自己终止 TLS 时它就是 https；
    #      若前面还有一层 LB 终结 TLS，它会取到外层透传的 https；都没有才退回实际连接协议。
    #    · 端口 —— $host 不含端口。监听 443（https 默认端口）时 auth 算出的 https://<host> 正好对得上；
    #      若改成非 443 端口（如 8443），靠下面传的 X-Forwarded-Port（文件头那个 map，
    #      入口透传优先、否则取本 nginx 的 $server_port）才不会丢端口。
    #    登录 POST（/auth/user/login）正是写会话 Cookie 的那一步，Secure 属性由它决定，
    #    所以这条规则虽也覆盖静态资源，头必须带全。
    location /auth/ {
        proxy_pass ${PLATFORM_AUTH_URL};
        # $auth_host（= $http_host，含端口），**不要**换成 $host，否则 issuer/登录页丢端口
        proxy_set_header Host              $auth_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # 见文件头的 map：$host 不含端口，issuer / 登录页地址要靠这个头拿回端口
        proxy_set_header X-Forwarded-Port  $auth_port_header;
    }

    # ⚠️ /callback 有意**不转给**认证服务器：那是 SPA 自己的路由（oauth.ts 的 redirect_uri），
    #    认证服务器上那个同名端点是个遗留 demo，与登录无关。

    # ---------- 运行时配置 ----------
    # 与 nginx.conf 同一套：SPA 的回调地址由容器环境变量 PLATFORM_OAUTH_REDIRECT_URI 现生成，
    # 改值 + 重启容器即生效，不用重新构建。空值 = 未配置，回落到「页面 origin + /callback」。
    # ⚠️ 值里不要带双引号 —— 它被内联进 JS 字面量。
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.__PLATFORM_RUNTIME_CONFIG__ = {"oauthRedirectUri":"${PLATFORM_OAUTH_REDIRECT_URI}"};';
    }

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
