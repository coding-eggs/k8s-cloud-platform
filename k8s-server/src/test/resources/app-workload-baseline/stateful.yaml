---
# Source: app-workload/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "shop-api"
  namespace: "demo"
  labels:
    app.kubernetes.io/name: "shop"
    app.kubernetes.io/managed-by: k8s-cloud-platform
    platform.coding/app: "app_1"
    platform.coding/app-node: "api"
    platform.coding/managed: "true"
  annotations:
    platform.coding/revision: "1"
spec:
  serviceName: "shop-api-headless"
  replicas: 2
  selector:
    matchLabels:
      platform.coding/app: "app_1"
      platform.coding/app-node: "api"
  template:
    metadata:
      labels:
        platform.coding/app: "app_1"
        platform.coding/app-node: "api"
      annotations:
        platform.coding/config-hash: "714b78e97c8c5d2c90049f01d11d122a"
    spec:
      containers:
        - name: app
          image: "nginx"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
