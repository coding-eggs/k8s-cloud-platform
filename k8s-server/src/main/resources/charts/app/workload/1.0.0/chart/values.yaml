app:
  id: ""
  slug: ""
  revision: 0

workload:
  key: ""
  # service = 有端口、可建 Service；worker = 无端口、不建 Service
  mode: service
  image: ""
  imagePullPolicy: IfNotPresent
  port: 8080
  replicas: 1
  command: []
  args: []
  # 普通环境变量：[{name, value}] → ConfigMap
  env: []
  # 引用已有 Secret：[{name, secretName, secretKey}] → valueFrom.secretKeyRef
  # 平台不接收明文敏感值（spec/快照/清单里都不能出现密码），要敏感就先用「Secret」页建好再引用
  secretEnv: []
  # 配置文件：[{key, path, content}] → ConfigMap `<name>-files`，每个文件以只读 subPath 挂到 path
  # 内容不含凭据（platform-api 保存时拒绝 ${x.username|password}）；改内容靠 configHash 滚动 Pod
  configFiles: []
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    mountPath: /data
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCpu: 60
    # 内存目标利用率 %；0 = 不加内存指标
    targetMemory: 0
  probe:
    # 关掉探针：非 HTTP 服务（gRPC / 只监听 TCP）必须关，否则 Pod 永远 NotReady
    enabled: true
    path: /
  metrics:
    enabled: false
    path: /metrics
  # 通用注入（platform-api 由 desired.otel / desired.mesh 翻译，k8s-server 只透传）
  podAnnotations: {}
  podLabels: {}
  serviceLabels: {}
  # [{name, value}]：排在 inlineEnv 之后写进容器 env[].value
  extraEnv: []
  # 文件日志：emptyDir 卷 platform-otel-logs 挂到主容器 mountDir
  logVolume:
    enabled: false
    mountDir: ""
  expose:
    # none（仅集群内 ClusterIP）/ nodeport
    type: none
    port: 8080
