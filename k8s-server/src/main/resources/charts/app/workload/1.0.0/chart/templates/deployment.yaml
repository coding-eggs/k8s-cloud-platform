{{- $stateful := and (eq .Values.workload.mode "service") .Values.workload.persistence.enabled -}}
{{- if not $stateful }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    {{- include "app.revision" . | nindent 4 }}
spec:
  {{- /* HPA 开启时不写 replicas：SSA forceConflicts 会把 HPA 扩出的副本每次发布都打回去 */}}
  {{- if not .Values.workload.autoscaling.enabled }}
  replicas: {{ .Values.workload.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selector" . | nindent 8 }}
      {{- with .Values.workload.configHash }}
      annotations:
        platform.coding/config-hash: {{ . | quote }}
      {{- end }}
    spec:
      {{- with .Values.workload.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.workload.configFiles }}
      volumes:
        - name: config-files
          configMap:
            name: {{ include "app.name" . }}-files
      {{- end }}
      containers:
        - name: app
          image: {{ .Values.workload.image | quote }}
          imagePullPolicy: {{ .Values.workload.imagePullPolicy }}
          {{- if eq .Values.workload.mode "service" }}
          ports:
            - name: http
              containerPort: {{ .Values.workload.port }}
          {{- end }}
          {{- with .Values.workload.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workload.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.workload.env .Values.workload.secretEnv .Values.workload.inlineEnv }}
          env:
            {{- range .Values.workload.env }}
            - name: {{ .name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.name" $ }}-env
                  key: {{ .name }}
            {{- end }}
            {{- range .Values.workload.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.workload.inlineEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.workload.configFiles }}
          volumeMounts:
          {{- range .Values.workload.configFiles }}
            - name: config-files
              mountPath: {{ .path | quote }}
              subPath: {{ .key | quote }}
              readOnly: true
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.workload.resources | nindent 12 }}
          {{- if and (eq .Values.workload.mode "service") .Values.workload.probe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.workload.probe.path }}
              port: http
            initialDelaySeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.workload.probe.path }}
              port: http
            initialDelaySeconds: 30
            failureThreshold: 3
          {{- end }}
{{- end }}
