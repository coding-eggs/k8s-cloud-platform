{{- if eq .Values.workload.mode "service" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- range $k, $v := .Values.workload.serviceLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  type: {{ if eq .Values.workload.expose.type "nodeport" }}NodePort{{ else }}ClusterIP{{ end }}
  selector:
    {{- include "app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.workload.expose.port }}
      targetPort: http
      {{- if and (eq .Values.workload.expose.type "nodeport") (gt (int .Values.workload.expose.nodePort) 0) }}
      nodePort: {{ .Values.workload.expose.nodePort }}
      {{- end }}
{{- end }}
