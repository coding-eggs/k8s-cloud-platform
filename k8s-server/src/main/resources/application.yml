server:
  port: 8080

k8s:
  cloud:
    kubeconfig:
      aes-key: daXs1znnIStfQCVFyC8cvuS9OQZRTgeBJLLrrvu/hUM=

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.coding.data.models
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

spring:
  # 集群探活（ClusterAvailabilityProber）会在不可达集群上各占一次 connect 超时；
  # 默认单线程调度池会把 PipelineRunTicker（30s）一起拖住，所以给到 2
  task:
    scheduling:
      pool:
        size: 2
  servlet:
    multipart:
      max-file-size: 5120MB
      max-request-size: 5120MB
      enabled: true
  application:
    name: k8s-server
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://192.168.31.80:1234/k8s_cloud_platform?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:coding}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      max-lifetime: 0
      connection-test-query: SELECT 1
  security:
    ignore-urls:
      - "/actuator/**"
      - "/doc.html"
      - "/assets/**"
      - "/404"
      - "/500"
      - "/v3/api-docs/**"
      - "/v2/api-docs"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
      - "/swagger-resources/**"
      - "/webjars/**"
      - "/test/**"
      - "/.well-known/**"
      - "/manifest.json"
    oauth2:
      resourceserver:
        jwt:
          audiences: gateway-code-client
          jwk-set-uri: ${OAUTH2_SERVER:http://127.0.0.1:9527/oauth2/jwks}
          type: JWS
#          jwe:
#            secret: 123231sdsadweasdasdsaqA23vvssa22
#            secret-alg: A256KW
#            enc-method: A256GCM


jwt:
  enabled: false
  data-key: data

logging:
  level:
    root: info

# CI（Tekton）：归档整条链都在本进程内完成（抓快照 → 落库 → 删对象），
# **没有任何跨进程调用**，所以这里不需要共享密钥、也不需要 platform-api 的地址。
platform:
  components:
    # S3.6：内置 chart 的根目录（镜像里由 Dockerfile COPY 到 /app/charts）
    charts-dir: ${COMPONENT_CHARTS_DIR:charts}
  object-storage:
    # SeaweedFS 组件在集群里的位置：命名空间 / 平台接管的 identities 配置 Secret / S3 网关 Deployment
    namespace: ${OBJECT_STORAGE_NAMESPACE:platform-storage}
    config-secret: ${OBJECT_STORAGE_CONFIG_SECRET:platform-seaweedfs-s3-config}
    s3-deployment: ${OBJECT_STORAGE_S3_DEPLOYMENT:seaweedfs-s3}
    # 缺省时的 S3 地址（正常情况下 platform-api 会带 endpoint 过来）
    default-endpoint: ${OBJECT_STORAGE_S3_ENDPOINT:http://192.168.31.80:38333}
  pipeline:
    archive:
      # 关掉它的后果（spec §4.5 显式记过）：Pod 不会被删（回到 Tekton 的默认行为），
      # 而且运行记录**只在集群里**、不落库。这个开关是给"我就是要用 pruner 自己管"的部署留的。
      enabled: ${PIPELINE_ARCHIVE_ENABLED:true}
    run:
      timeout: ${PIPELINE_RUN_TIMEOUT:30m}
      timeout-check: ${PIPELINE_TIMEOUT_CHECK:30s}
    log:
      # ⚠️ 与 platform-api 那份**保持一致**：归档在这里截断，而 platform-api 的
      # /pipeline/run/logs 在线看日志时也用同一个上限。两边不同的话，同一条日志
      # 「归档后」与「运行中」看到的长短会不一样。
      max-bytes: ${PIPELINE_LOG_MAX_BYTES:1048576}
