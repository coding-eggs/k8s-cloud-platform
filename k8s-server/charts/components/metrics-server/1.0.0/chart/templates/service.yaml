apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: metrics-server
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    k8s-app: metrics-server
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
