<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云平台统一认证</title>
    <link rel="stylesheet" href="./assets/index.css">
    <script src="./assets/vue.global.prod.js"></script>
    <script src="./assets/index.full.min.js"></script>
    <script src="./assets/axios.min.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/localStorage.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 420px;
            animation: fadeInDown .5s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .15);
            padding: 48px 40px 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(102, 126, 234, .4);
        }

        .login-header h1 {
            font-size: 22px;
            color: #303133;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #909399;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-item label {
            display: block;
            font-size: 14px;
            color: #606266;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #c0c4cc;
            font-size: 16px;
        }

        .form-input {
            width: 100%;
            height: 44px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 0 44px;
            font-size: 14px;
            color: #303133;
            outline: none;
            transition: all .2s ease;
            background: #fff;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, .15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #c0c4cc;
            font-size: 16px;
        }

        .toggle-password:hover {
            color: #909399;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, .4);
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, .5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: #fef0f0;
            border: 1px solid #fbc4c4;
            color: #f56c6c;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #c0c4cc;
        }

        /* SVG Icon inline */
        svg.icon { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>
<div id="app">
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>云平台统一认证</h1>
                <p>K8s Cloud Platform Auth Server</p>
            </div>

            <!-- Error Message -->
            <div class="error-msg" v-if="errorMsg">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#f56c6c">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span>{{ errorMsg }}</span>
            </div>

            <!-- Login Form -->
            <form @submit.prevent="handleLogin" method="post">
                <div class="form-item">
                    <label>用户名</label>
                    <div class="input-wrapper">
                        <svg class="input-icon icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v2h20v-2c0-3.33-6.67-5-10-5z"/>
                        </svg>
                        <input type="text" class="form-input" v-model="username" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                </div>

                <div class="form-item">
                    <label>密码</label>
                    <div class="input-wrapper">
                        <svg class="input-icon icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input :type="showPassword ? 'text' : 'password'" class="form-input" v-model="password" placeholder="请输入密码" required autocomplete="current-password">
                        <span class="toggle-password" @click="showPassword = !showPassword">
                            <svg v-if="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#c0c4cc">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12c-2.48 0-4.5-2.02-4.5-4.5s2.02-4.5 4.5-4.5 4.5 2.02 4.5 4.5-2.02 4.5-4.5 4.5zm0-7c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z"/>
                            </svg>
                            <svg v-else xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#c0c4cc">
                                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.8 11.8 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                            </svg>
                        </span>
                    </div>
                </div>

                <button type="submit" class="login-btn" :disabled="loading">
                    <span v-if="!loading">登 录</span>
                    <el-button :loading="true" circle style="visibility:hidden"></el-button>
                    <span v-if="loading" style="display:inline-block;">登录中...</span>
                </button>
            </form>

            <div class="footer-text">Cloud Platform Authentication Service</div>
        </div>
    </div>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const username = ref('');
        const password = ref('');
        const showPassword = ref(false);
        const errorMsg = ref('');
        const loading = ref(false);

        onMounted(() => {
            // 从 URL 参数获取 Spring Security 跳转带过来的错误标记
            const params = new URLSearchParams(window.location.search);
            if (params.has('error')) {
                errorMsg.value = '用户名或密码不正确，请重试';
            }

            // 恢复上次输入的用户名（方便调试）
            const savedUser = sessionStorage.getItem('_last_username');
            if (savedUser) username.value = savedUser;
        });

        async function handleLogin() {

            if (!username.value || !password.value) return;
            loading.value = true;
            errorMsg.value = '';
            sessionStorage.setItem('_last_username', username.value);

            const formData = new URLSearchParams();
            formData.append('username', username.value);
            formData.append('password', password.value);
            try {
                api({
                    method: 'post',
                    url: "/user/login",
                    data: formData,
                    headers : {
                        'Content-Type' : 'application/x-www-form-urlencoded;charset=UTF-8'
                    }
                }).then(res => {
                    let storage = new Storage();
                    storage.setItem({
                        name: "userinfo",
                        value: res.userinfo
                    })

                    console.log(res.requestURI)
                    if (res.requestURI) {
                        window.location.href=res.requestURI;
                    }
                })

            } catch (e) {
                this.$message({message:"登录失败",type:"error"})
            } finally {
                loading.value = false;
            }
        }

        // function doFormLogin() {
        //     const form = document.createElement('form');
        //     form.method = 'POST';
        //     form.action = '/user/login';
        //
        //     const uInput = document.createElement('input');
        //     uInput.type = 'hidden';
        //     uInput.name = 'username';
        //     uInput.value = username.value;
        //     form.appendChild(uInput);
        //
        //     const pInput = document.createElement('input');
        //     pInput.type = 'hidden';
        //     pInput.name = 'password';
        //     pInput.value = password.value;
        //     form.appendChild(pInput);
        //
        //     document.body.appendChild(form);
        //     form.submit();
        // }

        return { username, password, showPassword, errorMsg, loading, handleLogin };
    }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
