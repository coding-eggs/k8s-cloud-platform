<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统一认证 · K8s Cloud Platform</title>
    <link rel="stylesheet" href="./assets/index.css">
    <script src="./assets/vue.global.prod.js"></script>
    <script src="./assets/index.full.min.js"></script>
    <script src="./assets/axios.min.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/localStorage.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #22d3ee;
            --field: #0d1729;
        }

        * { box-sizing: border-box; }
        [v-cloak] { display: none; }

        body {
            margin: 0;
            color: var(--text);
            font: 14px/1.5 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background:
                radial-gradient(ellipse at 19% 42%, #142b43 0%, transparent 46%),
                radial-gradient(ellipse at 100% 100%, #171a35 0%, transparent 44%),
                #090f1d;
        }

        #app {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: clamp(24px, 6vw, 80px) 16px;
        }

        #app::before {
            content: '';
            position: absolute;
            z-index: -1;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(148, 163, 184, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, .05) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        .login-layout {
            width: min(100%, 1248px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(400px, 44vw, 552px);
            align-items: center;
            gap: clamp(40px, 6vw, 96px);
            padding-inline: clamp(0px, 3vw, 48px);
        }

        .login-brand {
            align-self: start;
            padding-top: clamp(54px, 5.6vw, 72px);
        }

        .login-brand h1 {
            margin: 0;
            font-size: clamp(30px, 4vw, 56px);
            line-height: 1.12;
            letter-spacing: -.025em;
        }

        .login-brand p {
            margin: 20px 0 0;
            font-size: clamp(14px, 1.6vw, 19px);
            color: #aebdd2;
        }

        .login-card {
            min-width: 0;
            padding: clamp(32px, 4vw, 52px) clamp(22px, 3.4vw, 44px);
            border: 1px solid #2c3b53;
            border-radius: 24px;
            background: linear-gradient(155deg, #17243a, #111a2e 68%);
        }

        .login-header {
            margin-bottom: 34px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin-bottom: 22px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            box-shadow: 0 8px 28px rgba(34, 211, 238, .28);
        }

        .login-header h2 {
            margin: 0;
            font-size: clamp(26px, 3vw, 32px);
            line-height: 1.2;
            letter-spacing: -.025em;
        }

        .form-item {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .password-field {
            position: relative;
        }

        input, button {
            font: inherit;
        }

        .form-input {
            width: 100%;
            min-height: 54px;
            padding: 0 16px;
            border: 1px solid #536581;
            border-radius: 12px;
            background: var(--field);
            color: var(--text);
            font-size: 16px;
            caret-color: var(--accent);
        }

        .form-input::placeholder { color: var(--muted); }
        .password-field .form-input { padding-right: 56px; }

        .form-input:focus, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .toggle-password {
            position: absolute;
            top: 5px;
            right: 5px;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .toggle-password:hover,
        .toggle-password:focus-visible {
            background: #1e3049;
            color: var(--text);
        }

        .login-btn {
            width: 100%;
            min-height: 54px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: #070b14;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(59, 130, 246, .26);
        }

        .login-btn:hover:not(:disabled) { filter: brightness(1.1); }
        .login-btn:active:not(:disabled) { filter: brightness(.94); }
        .login-btn:disabled { opacity: .75; cursor: wait; }

        .error-msg {
            margin: 0 0 16px;
            padding: 9px 12px;
            border: 1px solid #86445a;
            border-radius: 8px;
            background: #321d30;
            color: #fecdd3;
            overflow-wrap: anywhere;
        }

        @media (max-width: 860px) {
            .login-layout {
                width: min(100%, 520px);
                grid-template-columns: minmax(0, 1fr);
                gap: 24px;
                padding-inline: 0;
            }

            .login-brand { padding: 0 8px; }
            .login-brand h1 { font-size: clamp(25px, 7.5vw, 44px); }
            .login-brand p { margin-top: 8px; }
            .login-header { margin-bottom: 26px; }
            .brand-mark { width: 44px; height: 44px; margin-bottom: 14px; border-radius: 12px; }
            .brand-mark svg { width: 24px; height: 24px; }
        }

        @media (max-width: 420px) {
            #app { padding-inline: 14px; }
            .login-card { padding-inline: 18px; }
        }
    </style>
</head>
<body>
<main id="app">
    <div class="login-layout" v-cloak>
        <header class="login-brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="none">
                    <path d="M12 2.2 20.4 7.1v9.8L12 21.8 3.6 16.9V7.1L12 2.2Z"
                          stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3.2" fill="#fff"/>
                </svg>
            </span>
            <h1 lang="en">K8s Cloud</h1>
            <p>集群管理 · 租户管理 · 资源运维</p>
        </header>

        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <h2 id="login-title">统一认证</h2>
            </header>

            <div role="alert">
                <p v-if="errorMsg" class="error-msg">{{ errorMsg }}</p>
            </div>

            <form @submit.prevent="handleLogin" method="post" action="user/login" :aria-busy="loading">
                <div class="form-item">
                    <label for="username">用户名</label>
                    <input id="username" name="username" type="text" class="form-input" v-model="username"
                           placeholder="请输入用户名" required autocomplete="username">
                </div>

                <div class="form-item">
                    <label for="password">密码</label>
                    <div class="password-field">
                        <input id="password" name="password" :type="showPassword ? 'text' : 'password'"
                               class="form-input" v-model="password" placeholder="请输入密码"
                               required autocomplete="current-password">
                        <button type="button" class="toggle-password" aria-controls="password"
                                :aria-label="showPassword ? '隐藏密码' : '显示密码'"
                                :title="showPassword ? '隐藏密码' : '显示密码'"
                                @click="showPassword = !showPassword">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <template v-if="showPassword">
                                    <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6 0 10 7 10 7a16 16 0 0 1-3 3.6M6.2 6.9A17 17 0 0 0 2 12s4 7 10 7a10 10 0 0 0 4.8-1.3"/>
                                </template>
                                <template v-else>
                                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </template>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" :disabled="loading">
                    {{ loading ? '登录中…' : '登录' }}
                </button>
            </form>
        </section>
    </div>
</main>

<script>
const { createApp, ref, onMounted } = Vue;
const invalidCredentials = '用户名或密码不正确，请重试';

createApp({
    setup() {
        const username = ref('');
        const password = ref('');
        const showPassword = ref(false);
        const errorMsg = ref('');
        const loading = ref(false);

        onMounted(() => {
            if (new URLSearchParams(window.location.search).has('error')) {
                errorMsg.value = invalidCredentials;
            }

            username.value = sessionStorage.getItem('_last_username') || '';
        });

        async function handleLogin() {
            if (loading.value || !username.value || !password.value) return;

            loading.value = true;
            errorMsg.value = '';

            try {
                sessionStorage.setItem('_last_username', username.value);
                const formData = new URLSearchParams({
                    username: username.value,
                    password: password.value
                });

                // 使用相对路径，保留认证服务的 /auth 上下文路径。
                const result = await api({
                    method: 'post',
                    url: 'user/login',
                    data: formData,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                    }
                });

                if (result?.requestURI) {
                    new Storage().setItem({ name: 'userinfo', value: result.userinfo });
                    window.location.href = result.requestURI;
                    return;
                }

                // Spring Security 登录失败后会重定向回带有 error 参数的登录页。
                const responseUrl = result?.request?.responseURL;
                errorMsg.value = responseUrl && new URL(responseUrl).searchParams.has('error')
                    ? invalidCredentials
                    : '登录失败，请重试';
            } catch {
                errorMsg.value = '登录失败，请重试';
            } finally {
                loading.value = false;
            }
        }

        return { username, password, showPassword, errorMsg, loading, handleLogin };
    }
}).mount('#app');
</script>
</body>
</html>
