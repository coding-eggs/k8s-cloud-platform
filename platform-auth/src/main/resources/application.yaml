server:
  port: 9527
  # 全局上下文路径：**所有端点**都在 /auth 下（/auth/oauth2/**、/auth/session/**、/auth/login.html、
  # /auth/user/**、/auth/assets/**、/auth/.well-known/**），于是前端/反代只需一条 `/auth/` 前缀转发，
  # 新增端点也不用再改代理白名单。
  # ⚠️ 2026-10-27 实测，四处必须一起对齐：
  #   · 前端 VITE_OAUTH_ISSUER=/auth（拼出 /auth/oauth2/authorize 等相对路径）
  #   · platform-api / k8s-server 的 jwk-set-uri 要带 /auth（否则拉不到验签密钥，全站 401）
  #   · 静态页面（login.html / consent.html / client-manage.html）里的接口地址必须是**相对路径**
  #   · 探针与文档入口随之变成 /auth/actuator/**、/auth/doc.html、/auth/.well-known/…
  # ⚠️ issuer 也随之变成 http://<host>/auth（SAS 按请求现算时会带上 context path；实测
  #    Location 为 http://host:port/auth/login.html、issuer 为 http://host:port/auth）。
  servlet:
    context-path: /auth
  # 采信反向代理带来的 X-Forwarded-*（platform-web 的 nginx 已在发 X-Forwarded-Proto / -For，
  # 见 platform-web/nginx.conf）。issuer 与 OIDC metadata 的端点地址是按请求的 host+scheme
  # 现算的，不配这项时 https 前门会被推成 http://（2026-10-26 实测）。
  # ⚠️ 前提是前面确有一层可信代理、且用 proxy_set_header **赋值**覆盖这两个头（nginx.conf 是赋值，
  #    不是追加）；若本端口直接暴露到公网，开这个等于允许客户端自报 scheme/host。
  # 直连访问（不经代理、没有转发头）行为不变。
  # ⚠️ 没有转发头时**不做任何改写**：scheme/host/port 就用这条连接的事实（host、port 取自 Host 头；
  #    Host 里没写端口就按协议的默认端口 80/443 —— 2026-10-27 实测：Host=192.168.85.1:5173 → 带 :5173，
  #    Host=192.168.85.1 → 端口消失）。所以反代若用 nginx 的 `$host`（不含端口）赋 Host，
  #    在前门不是 80/443 时必须补 X-Forwarded-Port，否则 issuer 与登录跳转会掉到默认端口。
  #    另一种选择是关掉本项：Tomcat 直接从 Host 头取 host+port（实测带端口），前端就不用发
  #    X-Forwarded-Port —— 代价是 scheme 恒为实际连接协议，TLS 终止在前面的部署会被算成 http://，
  #    故保留本项。两处必须成对理解，见 platform-web/nginx.conf 的认证段落。
  forward-headers-strategy: framework

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.coding.data.models
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

spring:
  security:
    oauth2:
      authorizationserver:
        issuer: ${OAUTH2_SERVER:http://127.0.0.1:9527}
    ignore-urls:
      - "/actuator/**"
      - "/doc.html"
      - "/assets/**"
      - "/login.html"
      - "/user/login"
      # 登出端点：由 SecurityFilterChain 的 LogoutFilter 处理（排在授权过滤器之前），
      # 此处登记只为显式化；留着早先的死条目 /user/logout（无任何 handler）只会误导排查。
      - "/session/logout"
      - "/404"
      - "/500"
      - "/v3/api-docs/**"
      - "/v2/api-docs"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
      - "/swagger-resources/**"
      - "/webjars/**"
      - "/test/**"
      - "/favicon.ico"
      - "/favicon-dark.svg"
      - "/favicon-light.svg"
      - "/.well-known/**"
      - "/manifest.json"

  servlet:
    multipart:
      max-file-size: 5120MB
      max-request-size: 5120MB
      enabled: true
  application:
    name: platform-auth
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://192.168.31.80:1234/k8s_cloud_platform?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:coding}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      max-lifetime: 0
      connection-test-query: SELECT 1

  # Redis（Spring Session 会话存储）连接参数。
  data:
    redis:
      host: ${REDIS_HOST:192.168.31.80}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Coding@123456}     # ← 无密码则留空
      database: 1
      timeout: 5s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
          time-between-eviction-runs: 30000ms

# 注：Spring Boot 4.x 已移除 spring.session.* 自动装配，Redis 会话改由 @EnableRedisHttpSession
#     显式启用（见 com.coding.auth.config.RedisSessionConfig），8h 空闲超时也在那里配置。
jwt:
  enabled: true
  issuer: ${OAUTH2_SERVER:http://127.0.0.1:9527}
  data-key: data
platform:
  jwt:
    # 是否把权限点 code 全闭包写进 token 的 data.permissions（默认 false，2026-10-09 起不再写）。
    # 那份列表随产品权限点总数增长，却要塞进有硬上限的容器（WS 握手 query 4KB / HTTP 头 8KB），
    # 且带 1 小时保鲜期；改由 platform-api 按需解析（见 PermissionClosureResolver）。
    # ⚠️ 仅作回滚开关：置 true 即恢复旧行为（转换器 claim 优先，会照旧消费它），代价是 token 重新变大。
    permissions-in-token: false
logging:
  level:
    root: info
