server:
  port: 8081

k8s:
  # k8s-server（唯一 K8s 适配器）管理域地址，/admin/** 端点
  server:
    url: ${K8S_SERVER_URL:http://127.0.0.1:8080}
  cloud:
    kubeconfig:
      aes-key: ${KUBECONFIG_AES_KEY:daXs1znnIStfQCVFyC8cvuS9OQZRTgeBJLLrrvu/hUM=}

thanos:
  # Thanos Query（全局单端点、无鉴权）；各集群 Prometheus remote_write 汇入并统一打 cluster_name 标签
  query:
    url: ${THANOS_QUERY_URL:http://192.168.31.80:19090}

platform:
  credential:
    # 凭据库（platform_credential）的 AES 主密钥。**独立于 k8s.cloud.kubeconfig.aes-key**：
    # 轮换边界独立，且不扩散后者把默认密钥硬编码在配置里的坏味道。
    # ⚠️ 没有默认值：留空应用会拒绝启动（CredentialCipher 的启动校验）。
    # 生成方式：调用 AESUtils.generateStrongKey()，把结果填进环境变量。
    aes-key: ${CREDENTIAL_AES_KEY:}
  registry:
    dockerhub:
      # 内置的 Docker Hub 档。**它不是凭据表里的一行**（见 BuiltinRegistry）：没有行、没有 authType、
      # 没有密文、没有启停状态，重放迁移后开箱即用，不用任何人手动建。
      # 关掉它 = 平台不再内置这一档 —— 隔离内网里没人希望每次按键都朝一个不可达的地址打一发。
      enabled: ${DOCKERHUB_ENABLED:true}
  outbound:
    proxy:
      # 出站代理：**只有 targets 里列出的目标走代理，其余一律直连**。
      #
      # ⚠️ 键名刻意不叫 host / hosts —— 那两个只差一个字母，一个指**代理服务器**、
      # 一个指**要走它的目标**，最容易看反。所以是 server（代理服务器）/ targets（走它的目标）。
      #
      # ⚠️ 为什么是白名单而不是「一个全局代理」：平台只有两类出站是朝公网的
      # （Docker Hub、外网 git host），其余全是内网（k8s-server 127.0.0.1:8080、
      # Thanos、Prometheus、自建 Harbor / gitlab）。配一个"替所有出站"的代理意味着
      # **代理填错时内网流量也被导出去** —— 那是最难查的一类故障。
      #
      # ⚠️ 精确匹配，不做后缀：github.com 不会命中 raw.githubusercontent.com。
      # 宁可多写一行，也不要"以为配了一个域名、其实整个子域都被导出去了"。
      #
      # ⚠️ targets 留空 = **全直连**，代理形同不存在。
      server: ${OUTBOUND_PROXY_SERVER:}     # 代理服务器地址（不是"要走代理的域名"）
      port: ${OUTBOUND_PROXY_PORT:0}
      targets: ${OUTBOUND_PROXY_TARGETS:hub.docker.com,github.com}   # 逗号分隔；只有这些走代理
  namespace:
    # 受保护（系统）命名空间：命中者不可编辑 / 删除 / 设配额 / 设限制范围，读仍开放。
    # 精确匹配，须与集群内真实 ns 名一致；按部署环境增删。
    protected-namespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - calico-system
      - monitoring
      - operators
      - istio-system
      - ingress-nginx
      - cert-manager

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.coding.data.models
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

spring:
  application:
    name: platform-api
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://192.168.31.80:1234/k8s_cloud_platform?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:coding}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      max-lifetime: 0
      connection-test-query: SELECT 1

  # Redis：**跨实例共享的 TTL 缓存**（权限闭包 / Calico IPAM 派生查询）。
  # 多实例部署时各实例各存一份本地缓存 = 各查各的库、且同一用户在两个实例上可能拿到不同授权结果，
  # 故这两处缓存统一放这里。键统一带 platform:cache: 前缀，与同库里 auth 的会话键（spring:session:*）区分。
  # ⚠️ Redis 只优化负载，不是依赖：读失败即退化为"直接查源"（见 RedisJsonCache），不会因它挂掉而不可用。
  # ⚠️ 与 auth 会话共用一个 database：运维时**不要 FLUSHDB**（会连带踢掉所有登录会话）。
  data:
    redis:
      host: ${REDIS_HOST:192.168.31.80}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Coding@123456}     # ← 无密码则留空
      database: ${REDIS_CACHE_DATABASE:1}
      timeout: 2s                # 卡住时不要拖慢请求路径（超时即直查源）
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  security:
    ignore-urls:
      - "/actuator/**"
      - "/doc.html"
      - "/assets/**"
      - "/404"
      - "/500"
      - "/v3/api-docs/**"
      - "/v2/api-docs"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
      - "/swagger-resources/**"
      - "/webjars/**"
      - "/test/**"
      - "/.well-known/**"
      - "/manifest.json"
    oauth2:
      resourceserver:
        jwt:
          # 不校验 audience：平台管理端接受 auth server 签发的任意客户端 token
          jwk-set-uri: ${OAUTH2_SERVER:http://127.0.0.1:9527/oauth2/jwks}
          type: JWS
          # 若 auth server 使用对称签名，可改为：
          #   jws:
          #     secret: <与客户端一致的密钥>
          #     secret-alg: HS256
jwt:
  enabled: false
  data-key: data

logging:
  level:
    root: info
